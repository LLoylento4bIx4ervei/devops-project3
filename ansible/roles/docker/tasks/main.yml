---
- name: Update the apt cache
  apt: 
    update_cache: yes
    cache_valid_time: 3600

- name: Install Docker
  apt: 
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present


- name: Add user into group docker
  user: 
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes

- name: Verify that Docker is running
  command: docker --version
  register: docker_version
  changed_when: false

- name: Show Docker version
  debug:
    msg: "Install: {{ docker_version.stdout }}"   
